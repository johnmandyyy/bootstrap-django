{% extends "app/layout.html" %}
{% load static %}
{% load crispy_forms_tags %}
{% block content %}

<div id="{{ obj_name }}">

    <div class="row">

    </div>

</div>

<script>

new Vue({
    
    delimiters: ["[[", "]]"],
    el: "#" + '{{ obj_name }}',
    
    data: {

        loading_state: {
            'OBJECT': true
        },

        lists: {
            'OBJECT': []
        },

        url_models: {
            'OBJECT': '/object/'
        },

        endpoints: {
            'LIST_GET': '/api/list-get',
            'LIST_CREATE': '/api/list-create',
            'GET_UPDATE_DESTROY': '/api/get-update-destroy'
        },

        info: {
            'MESSAGE': 'Sample Message',
            'TITLE': 'Sample Title'
        },

        props: {
            'OBJECT': {}
        },

        state: {
            'OBJECT': null
        }
        
    },

    mounted() {
        if (document.querySelector("#" + '{{ obj_name }}')) {
            console.log("Mounted " + '{{ obj_name }}' + " page.")
        }

    },

    methods: {

        async universalPatch(object,
            endpoint_name, 
            model_name, 
            list_item, 
            loading_state = false, identifier = null, props = null
            ) {

                const url = object.endpoints[endpoint_name]
                + object.url_models[model_name] 
                + object.state[identifier] + "/"

                try {

                    axios.defaults.headers.common['X-CSRFToken'] = getCookie('csrftoken')
                    const result = await axios.patch(url, object.props[props])

                    if (result) {
                        await this.universalGet(this, 'LIST_GET', model_name, list_item, loading_state, {page: 1})
                    }

                } catch (error) {console.log(error)}

            },

            // Async Methods
            async universalGet (object,
                endpoint_name, 
                model_name, 
                list_item, 
                loading_state = null,
                filters = null, custom_url = ''
                ) {
                
                var url = custom_url 
                    ? custom_url 
                    : object.endpoints[endpoint_name] + object.url_models[model_name];


                const authToken = localStorage.getItem('token')

                try {

                    if (loading_state !== null) {
                        object.loading_state[loading_state] = true
                    }
                    
                    if (filters !== null) {
                        url = buildUrl(url, filters)
                    }

                    const result = await axios.get(url, {
                        headers: {
                            'Authorization': `Bearer ${authToken}`
                        }
                    });

                    if (result) {
                        object.lists[list_item] = result.data
                    }
                    
                } catch (error) {
                    console.log(error)
                }

                object.loading_state[loading_state] = false
        
            },

        async get() {

            const authToken = localStorage.getItem('token')
            const url = '';

            try {

                const result = await axios.get(url, {
                    headers: {
                        'Authorization': `Bearer ${authToken}`
                    }
                });

                if (result) {
                    console.log(result)
                }

            } catch (error) {
                console.log(error)
            }

        },

        async post() {

            const authToken = localStorage.getItem('token')
            const url = '';

            try {
                
                const payload = { key1: "value1", key2: "value2" };
                const result = await axios.post(url, payload, {
                    headers: {
                        'Authorization': `Bearer ${authToken}`,
                        'Content-Type': 'application/json'
                    }
                });

                if (result) {
                    console.log(result)
                }

            } catch (error) {
                console.log(error)
            }
            
        },

        async put() {

            const authToken = localStorage.getItem('token')
            const url = '';

            try {
                
                const payload = { key1: "value1", key2: "value2" };
                const result = await axios.put(url, payload, {
                    headers: {
                        'Authorization': `Bearer ${authToken}`,
                        'Content-Type': 'application/json'
                    }
                });

                if (result) {
                    console.log(result)
                }

            } catch (error) {
                console.log(error)
            }
            
        },

        async patch() {

            const authToken = localStorage.getItem('token')
            const url = '';

            try {
                
                const payload = { key1: "value1", key2: "value2" };
                const result = await axios.patch(url, payload, {
                    headers: {
                        'Authorization': `Bearer ${authToken}`,
                        'Content-Type': 'application/json'
                    }
                });

                if (result) {
                    console.log(result)
                }

            } catch (error) {
                console.log(error)
            }
            
        },

        async delete() {

            const authToken = localStorage.getItem('token')
            const url = '';

            try {
                
                const payload = { key1: "value1", key2: "value2" };
                const result = await axios.delete(url, payload, {
                    headers: {
                        'Authorization': `Bearer ${authToken}`,
                        'Content-Type': 'application/json'
                    }
                });

                if (result) {
                    console.log(result)
                }

            } catch (error) {
                console.log(error)
            }
            
        },
        
    },
});

</script>

{% endblock %}
